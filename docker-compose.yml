services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env.example
  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on: [backend]
